<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Politeknik Student Registration Form</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body {
    background-color: #f3f3f3;
  }
  .form-box {
    background-color: white;
    width: 800px;
    margin: 30px auto;
    padding: 30px 40px;
    border-radius: 10px;
    box-shadow: 0 0 8px rgba(0,0,0,0.1);
  }
  h2, h5 {
    text-align: center;
    font-weight: bold;
  }
  .form-group {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
  }
  .form-group label {
    width: 180px;
    font-weight: 500;
    margin-right: 10px;
  }
  .form-group input,
  .form-group select {
    flex: 1;
  }
  .image-preview {
    width: 150px;
    height: 150px;
    border: 2px dashed #ccc;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-color: #fafafa;
    margin-right: 10px;
  }
  .image-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .btn {
    width: 120px;
  }
  /* Make dropdowns always open downward */
  select {
    position: relative;
    overflow: visible;
  }
</style>
</head>

<body>

<div class="form-box">
  <h2 style="color: red;">POLITEKNIK KUCHING SARAWAK</h2>
  <h5>Student Registration Form</h5>

  <!-- Error message alert -->
  <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

  <form id="registerForm">

    <!-- Student Image -->
    <div class="form-group">
      <label>Student Image:</label>
      <div class="d-flex align-items-center">
        <div class="image-preview" id="imagePreview">
          <span class="text-muted small">No image</span>
        </div>
        <div>
          <input type="file" id="studentImage" accept="image/*" onchange="previewImage(event)">
          <small class="text-muted d-block">(less than 5 Mb)</small>
          <button type="button" class="btn btn-outline-primary btn-sm mt-2" id="viewImageBtn" data-bs-toggle="modal" data-bs-target="#imageModal" style="display:none;">
            View Image
          </button>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Student Name:</label>
      <input type="text" id="studentName" class="form-control" onchange="toUpperCaseField(this)">
    </div>

    <div class="form-group">
      <label>Father's Name:</label>
      <input type="text" id="fatherName" class="form-control" onchange="toUpperCaseField(this)">
    </div>

    <div class="form-group">
      <label>Mother's Name:</label>
      <input type="text" id="motherName" class="form-control" onchange="toUpperCaseField(this)">
    </div>

    <div class="form-group">
      <label>Gender:</label>
      <div>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female" class="ms-3"> Female
      </div>
    </div>

    <div class="form-group">
      <label>Date of Birth:</label>
      <input type="date" id="dob" class="form-control" onblur="fieldBlur(this)">
    </div>

    <div class="form-group">
      <label>Email:</label>
      <input type="email" id="email" class="form-control" onfocus="highlightField(this)" onblur="removeHighlight(this)">
    </div>

    <div class="form-group">
      <label>Semester:</label>
      <select class="form-select">
        <option value="">Select</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>Internship</option>
      </select>
    </div>

    <div class="form-group">
      <label>JABATAN:</label>
      <select class="form-select">
        <option>Select</option>
        <option>Jabatan Kejuruteraan Awam</option>
        <option>Jabatan Kejuruteraan Mekanikal</option>
        <option>Jabatan Kejuruteraan Elektrik</option>
        <option>Jabatan Matematik, Sains dan Komputer</option>
        <option>Jabatan Perdagangan</option>
        <option>Jabatan Pengajian Am</option>
        <option>Jabatan Teknologi Maklumat dan Komunikasi</option>
        <option>Jabatan Kejuruteraan Petrokimia</option>
      </select>
    </div>

    <div class="form-group">
      <label>Tel/Mobile:</label>
      <input type="tel" id="mobile" class="form-control" placeholder="01xxxxxxxxx" maxlength="11" 
             onkeypress="return event.charCode >= 48 && event.charCode <= 57">
    </div>

    <hr>
    <h5>Address</h5>

    <div class="form-group">
      <label>State:</label>
      <input type="text" class="form-control">
    </div>

    <div class="form-group">
      <label>City:</label>
      <input type="text" class="form-control">
    </div>

    <div class="form-group">
      <label>Postcode:</label>
      <input type="text" id="postcode" class="form-control" placeholder="5 digits" maxlength="5" 
             onkeypress="return event.charCode >= 48 && event.charCode <= 57">
    </div>

    <div class="text-center mt-4">
      <button type="button" class="btn btn-primary me-3" onclick="submitForm()">Register</button>
      <button type="reset" class="btn btn-secondary" onclick="resetImage()">Reset</button>
    </div>
  </form>
</div>

<!-- Image Modal -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title w-100">Uploaded Image</h5>
      </div>
      <div class="modal-body">
        <img id="modalImage" src="" class="img-fluid rounded" alt="Uploaded Image">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Success Modal -->
<div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title w-100" id="successModalLabel">Success</h5>
      </div>
      <div class="modal-body">
        Your details have been saved!
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-success" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function previewImage(event) {
    const imagePreview = document.getElementById("imagePreview");
    const viewImageBtn = document.getElementById("viewImageBtn");
    const modalImage = document.getElementById("modalImage");

    imagePreview.innerHTML = "";
    const img = document.createElement("img");
    img.src = URL.createObjectURL(event.target.files[0]);
    imagePreview.appendChild(img);

    modalImage.src = img.src;
    viewImageBtn.style.display = "inline-block";
  }

  function resetImage() {
    const imagePreview = document.getElementById("imagePreview");
    const viewImageBtn = document.getElementById("viewImageBtn");
    const modalImage = document.getElementById("modalImage");
    imagePreview.innerHTML = '<span class="text-muted small">No image</span>';
    viewImageBtn.style.display = "none";
    modalImage.src = "";
    document.getElementById("errorMsg").classList.add("d-none");
  }

  function fieldBlur(input) {
    input.style.borderColor = '#ccc';
  }

  function highlightField(input) {
    input.style.borderColor = 'green';
    input.style.backgroundColor = '#eaffea';
  }

  function removeHighlight(input) {
    input.style.borderColor = '';
    input.style.backgroundColor = '';
  }

  function toUpperCaseField(input) {
    input.value = input.value.toUpperCase();
  }

  function submitForm() {
    const fields = document.querySelectorAll("input[type='text'], input[type='email'], input[type='date'], select");
    const gender = document.querySelector('input[name="gender"]:checked');
    const errorMsg = document.getElementById("errorMsg");
    const mobile = document.getElementById("mobile");
    const postcode = document.getElementById("postcode");

    const allEmpty = Array.from(fields).every(field => field.value.trim() === "") && !gender;

    const requiredFields = [
      document.getElementById("studentName"),
      document.getElementById("fatherName"),
      document.getElementById("motherName"),
      gender,
      document.getElementById("dob"),
      document.getElementById("email"),
    ];
    const allFilled = requiredFields.every(field => field && field.value.trim() !== "");

    if (allEmpty) {
      errorMsg.textContent = "Please fill in the form before submitting!";
      errorMsg.classList.remove("d-none");
      return;
    }

    if (!allFilled) {
      errorMsg.textContent = "Please fill in all required fields before submitting!";
      errorMsg.classList.remove("d-none");
      return;
    }


    const mobileValue = mobile.value.trim();
    if (mobileValue !== "" && !/^[0-9]{10,11}$/.test(mobileValue)) {
      errorMsg.textContent = "Please enter a valid 10 or 11-digit mobile number (numbers only).";
      errorMsg.classList.remove("d-none");
      return;
    }

    const postcodeValue = postcode.value.trim();
    if (postcodeValue !== "" && !/^[0-9]{5}$/.test(postcodeValue)) {
      errorMsg.textContent = "Please enter a valid 5-digit postcode (numbers only).";
      errorMsg.classList.remove("d-none");
      return;
    }

    errorMsg.classList.add("d-none");
    const successModal = new bootstrap.Modal(document.getElementById("successModal"));
    successModal.show();
  }
</script>

</body>
</html>
